<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>P.E.D.A.L. | Auto-Scan Terminal</title>
    
    <script src="jquery-3.7.1.min.js"></script>
    <script src="mock_data.js"></script> 
    
    <style>
        body { 
            background: #0a0a0a; 
            color: #00ff41; /* Classic Hacker Green */
            font-family: 'Consolas', 'Monaco', monospace; 
            margin: 0; 
            padding: 20px; 
            overflow-y: hidden; /* Скриваме скрола, JS ще скролва автоматично */
            font-size: 14px;
        }

        #console-output { 
            white-space: pre-wrap; 
            line-height: 1.6; 
            padding-bottom: 50px;
        }
        
        /* Стилизация на текста */
        .log-time { color: #555; font-size: 0.8em; }
        .log-error { color: #ff3b30; font-weight: bold; text-shadow: 0 0 5px rgba(255, 59, 48, 0.4); }
        .log-success { color: #34c759; }
        .highlight { color: #ffc107; font-weight: bold; } 
        .system-msg { color: #00bfff; } 
        .dim { color: #444; }

        /* Ефект на стар монитор (Scanline) */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="console-output"></div>

    <script>
        const output = document.getElementById('console-output');
        
        // Помощна функция за писане
        function print(text) {
            const time = new Date().toLocaleTimeString('bg-BG');
            // Добавяме и час за повече реализъм
            output.innerHTML += `<span class="log-time">[${time}]</span> ${text}<br>`;
            
            // Автоматично скролване до долу
            window.scrollTo(0, document.body.scrollHeight);
            
            // (Опционално) Пазим паметта чиста, като трием много стари редове
            if (output.childNodes.length > 200) { 
                // Премахваме първите няколко реда, ако станат твърде много
               // output.innerHTML = output.innerHTML.split('<br>').slice(1).join('<br>');
            }
        }

        // --- АВТОМАТИЧЕН СТАРТ ---
        
        // 1. Начална секвенция
        setTimeout(() => print("P.E.D.A.L. SYSTEM v2.8 [AUTO-PILOT MODE]"), 500);
        setTimeout(() => print("Сървър: bg-sofia-node-01"), 1000);
        setTimeout(() => print("Зареждане на модули за AI Видео Анализ..."), 1500);
        setTimeout(() => print("Връзка с API на КАТ... <span class='log-success'>[OK]</span>"), 2500);
        setTimeout(() => print("Свързване към мрежа от камери (142 активни)..."), 3500);

        // 2. Стартиране на безкрайния цикъл
        setTimeout(() => {
            print("<br><span class='system-msg'>=== СИСТЕМАТА Е ГОТОВА. ЗАПОЧВА АВТОМАТИЧНО СКАНИРАНЕ ===</span><br>");
            
            setInterval(() => {
                // Генерираме данни (коли или логове)
                const type = Math.random();

                if (type > 0.3) {
                    // 70% шанс за Сканиране на кола
                    const data = Generator.generateScanResult();
                    const confidencePercent = Math.round(data.confidence * 100);
                    
                    let violationHtml = `<span class='dim'>НЯМА</span>`;
                    let plateHtml = `<span class='highlight'>${data.plate}</span>`;
                    
                    // Ако е нарушение
                    if (parseFloat(data.confidence) > 0.85) {
                        violationHtml = `<span class='log-error'>${data.violation.toUpperCase()}</span>`;
                        print(`[СКЕНЕР] МПС: ${plateHtml} | ${data.model} | <span class='system-msg'>${data.location}</span>`);
                        print(`&nbsp;&nbsp;↳ СТАТУС: ${violationHtml} (Вероятност: ${confidencePercent}%)`);
                        print(`&nbsp;&nbsp;↳ Собственик: ${data.owner} -> <span class='log-error'>ДОКЛАДВАН</span>`);
                    } else {
                        // Чист автомобил (просто минаващ)
                        print(`[СКЕНЕР] МПС: ${plateHtml} | ${data.model} | Статус: Чист`);
                    }
                    print(`<span class='dim'>---------------------------------------------------</span>`);

                } else {
                    // 30% шанс за сървърен лог (за да изглежда като истински терминал)
                    const log = Generator.generateLog();
                    let formattedLog = log;
                    if(log.includes(" 200 ") || log.includes(" 201 ")) {
                        formattedLog = `<span class='log-success'>${log}</span>`;
                    } else {
                        formattedLog = `<span class='log-error'>${log}</span>`;
                    }
                    print(`[СЪРВЪР] ${formattedLog}`);
                }

            }, 1200); // Нова информация на всеки 1.2 секунди

        }, 4500);

    </script>
</body>
</html>
