name: Refresh Public Manifests

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  schedule:
    - cron: '35 6 * * *'

concurrency:
  group: generated-public-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate required secrets
        env:
          PEDAL_APPSYNC_ENDPOINT: ${{ secrets.PEDAL_APPSYNC_ENDPOINT }}
          PEDAL_APPSYNC_API_KEY: ${{ secrets.PEDAL_APPSYNC_API_KEY }}
          PEDAL_COGNITO_IDENTITY_POOL_ID: ${{ secrets.PEDAL_COGNITO_IDENTITY_POOL_ID }}
          PEDAL_S3_BUCKET: ${{ secrets.PEDAL_S3_BUCKET }}
        run: |
          for key in PEDAL_APPSYNC_ENDPOINT PEDAL_APPSYNC_API_KEY PEDAL_COGNITO_IDENTITY_POOL_ID PEDAL_S3_BUCKET; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required repository secret: $key"
              exit 1
            fi
          done

      - name: Generate manifests
        env:
          PEDAL_APPSYNC_ENDPOINT: ${{ secrets.PEDAL_APPSYNC_ENDPOINT }}
          PEDAL_APPSYNC_API_KEY: ${{ secrets.PEDAL_APPSYNC_API_KEY }}
          PEDAL_COGNITO_IDENTITY_POOL_ID: ${{ secrets.PEDAL_COGNITO_IDENTITY_POOL_ID }}
          PEDAL_S3_BUCKET: ${{ secrets.PEDAL_S3_BUCKET }}
          PEDAL_AWS_REGION: eu-central-1
        run: node scripts/generate_public_manifests.mjs

      - name: Detect generated changes
        id: changes
        run: |
          if git diff --quiet -- data share scripts/location-cache.json; then
            echo "any_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "any_changes=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet -- data/gallery-manifest.json; then
            echo "gallery_manifest_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "gallery_manifest_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        if: steps.changes.outputs.any_changes == 'true'
        id: commit_changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data share scripts/location-cache.json
          git commit -m "Refresh public manifests"

          BRANCH_NAME="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH_NAME"
            git rebase "origin/$BRANCH_NAME"

            if git push origin "HEAD:$BRANCH_NAME"; then
              echo "Push succeeded on attempt $attempt."
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "::error::Failed to push refreshed manifests after $attempt attempts."
              exit 1
            fi

            echo "Push rejected on attempt $attempt. Retrying after remote updates..."
            sleep $((attempt * 5))
          done

      - name: No generated changes
        if: steps.changes.outputs.any_changes != 'true'
        run: echo "No manifest changes detected."

      - name: Detect manifest upload credentials
        id: upload_auth
        env:
          PEDAL_MANIFEST_UPLOAD_ROLE_ARN: ${{ secrets.PEDAL_MANIFEST_UPLOAD_ROLE_ARN }}
          PEDAL_AWS_ACCESS_KEY_ID: ${{ secrets.PEDAL_AWS_ACCESS_KEY_ID }}
          PEDAL_AWS_SECRET_ACCESS_KEY: ${{ secrets.PEDAL_AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$PEDAL_MANIFEST_UPLOAD_ROLE_ARN" ]; then
            echo "has_role_upload_credentials=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_role_upload_credentials=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$PEDAL_AWS_ACCESS_KEY_ID" ] && [ -n "$PEDAL_AWS_SECRET_ACCESS_KEY" ]; then
            echo "has_static_upload_credentials=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_static_upload_credentials=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials for manifest upload (OIDC)
        if: steps.changes.outputs.gallery_manifest_changed == 'true' && steps.commit_changes.outputs.pushed == 'true' && steps.upload_auth.outputs.has_role_upload_credentials == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-central-1
          role-to-assume: ${{ secrets.PEDAL_MANIFEST_UPLOAD_ROLE_ARN }}

      - name: Configure AWS credentials for manifest upload (static secrets fallback)
        if: steps.changes.outputs.gallery_manifest_changed == 'true' && steps.commit_changes.outputs.pushed == 'true' && steps.upload_auth.outputs.has_role_upload_credentials != 'true' && steps.upload_auth.outputs.has_static_upload_credentials == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-central-1
          aws-access-key-id: ${{ secrets.PEDAL_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PEDAL_AWS_SECRET_ACCESS_KEY }}

      - name: Upload gallery manifest to S3
        if: steps.changes.outputs.gallery_manifest_changed == 'true' && steps.commit_changes.outputs.pushed == 'true' && (steps.upload_auth.outputs.has_role_upload_credentials == 'true' || steps.upload_auth.outputs.has_static_upload_credentials == 'true')
        run: |
          aws s3 cp \
            data/gallery-manifest.json \
            "s3://${{ secrets.PEDAL_S3_BUCKET }}/public/gallery-manifest.json" \
            --content-type application/json \
            --cache-control "public,max-age=300,s-maxage=300,must-revalidate"

      - name: Missing manifest upload credentials
        if: steps.changes.outputs.gallery_manifest_changed == 'true' && steps.commit_changes.outputs.pushed == 'true' && steps.upload_auth.outputs.has_role_upload_credentials != 'true' && steps.upload_auth.outputs.has_static_upload_credentials != 'true'
        run: |
          echo "::warning::Gallery manifest was refreshed in GitHub, but S3 upload was skipped because no upload credentials are configured."
          echo "::warning::Add PEDAL_MANIFEST_UPLOAD_ROLE_ARN (recommended) or PEDAL_AWS_ACCESS_KEY_ID / PEDAL_AWS_SECRET_ACCESS_KEY."
