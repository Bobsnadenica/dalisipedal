name: Refresh Black Map Snapshot

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  schedule:
    - cron: '20 3 1 * *'

concurrency:
  group: generated-public-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate black map snapshot
        run: node scripts/generate_black_map_snapshot.mjs

      - name: Commit changes
        run: |
          if git diff --quiet -- data/black-map-snapshot.json; then
            echo "No black map changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/black-map-snapshot.json
          git commit -m "Refresh black map snapshot"

          BRANCH_NAME="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH_NAME"
            git rebase "origin/$BRANCH_NAME"

            if git push origin "HEAD:$BRANCH_NAME"; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "::error::Failed to push refreshed black map snapshot after $attempt attempts."
              exit 1
            fi

            echo "Push rejected on attempt $attempt. Retrying after remote updates..."
            sleep $((attempt * 5))
          done
